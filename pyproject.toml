[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hublane"
# 版本号只有一处来源: hublane.py 里的 VERSION。这里不写死, 由 setuptools
# 在构建期读取(见文件末尾 [tool.setuptools.dynamic])。
# 原因: 写死就必然出现"改了一处忘另一处", 只能靠 check_version.py 事后比对;
# 现在改成派生, 从根上消掉重复 —— tools/check_version.py 会拦住任何
# 试图在这里重新写死 version 的改动。
dynamic = ["version"]
description = "Zero-dependency local relay proxy that makes GitHub reachable from WSL/Windows behind restrictive networks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The hublane Authors" }]
keywords = ["proxy", "relay", "github", "wsl", "mitm", "socks5", "gfw", "doh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 注意: 不要再加 "License :: OSI Approved :: MIT License" 分类器。
    # 上面的 license = "MIT" 是 PEP 639 的 SPDX 表达式, setuptools>=77 起
    # 两者共存会直接报 InvalidConfigError, sdist/wheel 根本构建不出来。
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/carsonz/hublane"
Repository = "https://github.com/carsonz/hublane"
Changelog = "https://github.com/carsonz/hublane/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/carsonz/hublane/blob/main/ROADMAP.md"
Security = "https://github.com/carsonz/hublane/security/advisories"

[project.scripts]
hublane = "hublane:main"

[project.optional-dependencies]
dev = ["flake8>=6", "build", "coverage>=7"]

[tool.setuptools]
py-modules = ["hublane"]

# 构建期从单一来源取版本号。hublane.py 只依赖标准库, 导入无副作用,
# 所以在 sdist/wheel 构建时读取是安全的(已验证: 导入后不写任何文件)。
[tool.setuptools.dynamic]
version = { attr = "hublane.VERSION" }
