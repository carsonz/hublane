name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PYTHONUTF8=1: Windows runner 是英文 locale, Python 控制台流默认用 cp1252,
# 而本项目的日志与提示全是中文 —— 没有它, 任何打印中文的步骤都会
# UnicodeEncodeError 让整个任务失败(实测: 五个 windows-latest 任务全红)。
# 代码里另有一层兜底(hublane.ensure_utf8_console / check_version 同款),
# 这里再设一次是给将来新增的脚本兜底。
env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 代码风格 (flake8, 配置见 setup.cfg)
        run: |
          python -m pip install --upgrade pip flake8
          python -m flake8 hublane.py tests tools

      - name: 配置校验
        run: python hublane.py --check

      - name: 单元 + 集成测试
        run: python -m unittest discover -s tests -v

      - name: 版本号一致性
        run: python tools/check_version.py

      - name: 覆盖率报告
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests
          python -m coverage report -m --include=hublane.py

      - name: 压测(与 bench/baseline.json 对比, 仅提示不阻断)
        continue-on-error: true
        run: python bench/bench_relay.py -n 100 -c 8 --check bench/baseline.json
