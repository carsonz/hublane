name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 代码风格 (flake8, 配置见 setup.cfg)
        run: |
          python -m pip install --upgrade pip flake8
          python -m flake8 hublane.py tests tools

      - name: 配置校验
        run: python hublane.py --check

      - name: 单元 + 集成测试
        run: python -m unittest discover -s tests -v

      - name: 版本号一致性
        run: python tools/check_version.py

      - name: 覆盖率报告
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests
          python -m coverage report -m --include=hublane.py

      - name: 压测(与 bench/baseline.json 对比, 仅提示不阻断)
        continue-on-error: true
        run: python bench/bench_relay.py -n 100 -c 8 --check bench/baseline.json
