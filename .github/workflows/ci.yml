name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PYTHONUTF8=1: Windows runner 是英文 locale, Python 控制台流默认用 cp1252,
# 而本项目的日志与提示全是中文 —— 没有它, 任何打印中文的步骤都会
# UnicodeEncodeError 让整个任务失败(实测: 五个 windows-latest 任务全红)。
# 代码里另有一层兜底(hublane.ensure_utf8_console / check_version 同款),
# 这里再设一次是给将来新增的脚本兜底。
env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 工作流 YAML 门禁
        # 工作流 YAML 解析失败时 GitHub 会"无 job 直接红", 日志里什么都看不到,
        # 只能在这里拦 —— 值里带 ": " 忘记加引号就会踩(ci.yml 自己踩过)。
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]; print('workflows OK')"
      - name: 代码风格 (flake8, 配置见 setup.cfg)
        run: |
          python -m pip install --upgrade pip flake8
          python -m flake8 hublane.py tests tools

      - name: 配置校验
        run: python hublane.py --check

      - name: 单元 + 集成测试
        run: python -m unittest discover -s tests -v

      - name: 版本号一致性
        run: python tools/check_version.py

      # v0.2.0 第 1 条: 覆盖率此前只出报告、没有门禁, 掉下去也不会有人知道。
      # 阈值取 70(当前实测 72), 留出缓冲但不放任下滑。
      - name: 覆盖率报告 + 门禁 (>=70%)
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests
          python -m coverage report -m --include=hublane.py --fail-under=70

      # v0.2.0 第 1b 条: 这两个脚本此前只能手动跑, 等于没测。
      - name: 安装脚本沙箱验证 (仅 Linux, install.sh 依赖 POSIX 路径约定)
        if: runner.os == 'Linux'
        run: bash tools/verify_install_sandbox.sh

      # 引号不能省: 值里带 ": " 时 YAML 会把它当成第二个 key, 整个工作流解析失败
      # (dc4aaba 起 CI 一直是"无 job 直接红"就是这个原因)。
      - name: "运行时端到端 (独立进程: 真面板 + 真 SOCKS5)"
        run: python tests/test_runtime_e2e.py

      - name: 压测(与 bench/baseline.json 对比, 仅提示不阻断)
        continue-on-error: true
        run: python bench/bench_relay.py -n 100 -c 8 --check bench/baseline.json
