name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag (例如 v0.2.0)"
        required: true

permissions:
  contents: write
  actions: write         # 建完 Release 后要显式 dispatch Gitee 同步工作流
  id-token: write        # 来源证明(attestation)需要 OIDC
  attestations: write

jobs:
  release:
    name: 打包并创建 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 版本门禁 (tag 必须等于 hublane.py 的 VERSION, 且版本号只有这一处来源)
        run: python tools/check_version.py "${{ github.event.inputs.tag || github.ref_name }}"

      - name: 测试门禁
        run: |
          python -m pip install --upgrade pip flake8
          python -m flake8 hublane.py tests tools
          python hublane.py --check
          python -m unittest discover -s tests -v

      - name: 打包 (源码 tar.gz + sdist/wheel)
        run: |
          VER="$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('hublane.py').read()).group(1))")"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          git archive --format=tar.gz --prefix="hublane-$VER/" -o "dist/hublane-$VER.tar.gz" HEAD
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist

      - name: 附加"下载即用"的单文件与安装脚本
        run: |
          cp hublane.py config.json dist/
          cp install.sh uninstall.sh dist/
          cp install-windows.bat uninstall-windows.bat dist/
          cp install-windows-service.bat uninstall-windows-service.bat dist/
          cp -r tools docs bench dist/ 2>/dev/null || true
          ls -l dist

      - name: 打包 Windows / Ubuntu 绿色压缩包
        # 用 Python 标准库打包, 不依赖 runner 上的 zip 命令; 把零散文件聚成两个
        # "开箱即用"压缩包, 发布资产不再是一堆散文件(各自含 hublane.py + 配置 + 安装/卸载脚本)
        run: |
          python - <<'PY'
          import os, zipfile, tarfile
          VER = os.environ["VER"]
          dist = "dist"

          def present(names):
              return [n for n in names if os.path.exists(os.path.join(dist, n))]

          win = present(["hublane.py", "config.json", "install-windows.bat",
                         "uninstall-windows.bat", "install-windows-service.bat",
                         "uninstall-windows-service.bat",
                         "tools/setup-git-ssh.ps1",
                         "tools/setup-firefox-policy.ps1"])
          with zipfile.ZipFile(os.path.join(dist, f"hublane-windows-{VER}.zip"),
                               "w", zipfile.ZIP_DEFLATED) as z:
              for f in win:
                  z.write(os.path.join(dist, f), arcname=f)

          ubu = present(["hublane.py", "config.json", "install.sh", "uninstall.sh"])
          with tarfile.open(os.path.join(dist, f"hublane-ubuntu-{VER}.tgz"),
                            "w:gz") as t:
              for f in ubu:
                  t.add(os.path.join(dist, f), arcname=f)
          print("green bundles -> windows:", win, "| ubuntu:", ubu)
          PY

      - name: 生成校验值 (SHA256SUMS)
        # 只校验文件, 跳过目录(上一步 cp -r 会把 tools/docs/bench 拷进 dist/,
        # 若用 sha256sum ./* 会对目录报错并令整个 job 退出码 1, 导致 Release 建不出来)
        run: |
          cd dist
          find . -type f -exec sha256sum {} + > SHA256SUMS
          cat SHA256SUMS

      - name: 发布来源证明 (provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/hublane-*.tar.gz,dist/hublane-*.whl"

      - name: 从 CHANGELOG 生成 Release 说明
        run: |
          python tools/changelog_section.py "${{ github.event.inputs.tag || github.ref_name }}" > RELEASE_NOTES.md
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hublane ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          # 关掉自动生成: GitHub 会把 "What's Changed" 的提交列表追加到 body 后面,
          # 与 CHANGELOG 段落重复且冗长。正文以 CHANGELOG 为准。
          generate_release_notes: false
          # 发布资产 = 两个绿色压缩包 + Python 源码包(sdist/wheel) + 校验文件
          # Ubuntu 包用 .tgz, 所以 hublane-*.tar.gz 只命中 sdist, 不会重复
          files: |
            dist/hublane-windows-*.zip
            dist/hublane-ubuntu-*.tgz
            dist/hublane-*.tar.gz
            dist/*.whl
            dist/SHA256SUMS

      - name: 触发 Gitee 附件同步
        # 用 GITHUB_TOKEN 建的 Release 不会再触发 release:published 事件
        # (GitHub 的规则: GITHUB_TOKEN 触发的事件不产生新的 workflow run),
        # 所以 gitee-sync.yml 的 release 触发器永远不会自己点火 —— 实测 v0.2.0
        # 打完 tag 后它一次都没跑。这里显式 dispatch 一次;
        # workflow_dispatch 是唯一能被 GITHUB_TOKEN 点着的事件。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh workflow run gitee-sync.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
          echo "已请求同步 $TAG"
